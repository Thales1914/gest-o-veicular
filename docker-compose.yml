services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gestao_veicular
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestao_veicular"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - gestao_veicular_postgres:/var/lib/postgresql/data

volumes:
  gestao_veicular_postgres:
